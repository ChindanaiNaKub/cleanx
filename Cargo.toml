[package]
name = "cleanx"
version = "0.1.0"
edition = "2024"
description = "A playful disk-space dashboard and safe-clean report, built with Rune."
license = "MIT"
publish = false

[workspace]

[dependencies]
# `tooling` is off by default in release builds (Rune enables it in debug
# builds only). The documented headless commands need it in shipped binaries.
rune = { path = "../rune-src/crates/rune", default-features = true, features = ["tooling"] }
rune-fx = { path = "../rune-src/crates/rune-fx" }
wgpu = { version = "~30.0.1", features = ["std", "parking_lot", "wgsl"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "~30.0.1", features = ["metal", "custom"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "~30.0.1", features = ["dx12"] }

[target.'cfg(all(not(target_vendor = "apple"), not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
wgpu = { version = "~30.0.1", features = ["vulkan"] }

# Rune depends on patched winit/wgpu-hal/parley. A dependency's [patch] does not
# reach the app that depends on it, so repeat the patches here.
[patch.crates-io]
wgpu-hal = { path = "../rune-src/vendor/wgpu-hal" }
winit = { path = "../rune-src/vendor/winit" }
sctk-adwaita = { path = "../rune-src/vendor/sctk-adwaita" }
parley_engine = { path = "../rune-src/vendor/parley_engine" }
accesskit_windows = { path = "../rune-src/vendor/accesskit_windows" }
accesskit_macos = { path = "../rune-src/vendor/accesskit_macos" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
